name: Release

on:
  push:
    tags:
      - "v*"
      - "V*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Check that the tag matches the Cargo version
        run: |
          tag_version="${GITHUB_REF_NAME#[vV]}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "cli") | .version')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $cargo_version (expected v$cargo_version)."
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p cli -p lsp --no-default-features --features server

      - name: Package
        run: |
          name="typst-languagetool-${GITHUB_REF_NAME}-${TARGET}"
          mkdir "$name"
          cp target/release/typst-languagetool target/release/typst-languagetool-lsp LICENSE readme.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "$ASSET" "$ASSET.sha256"
